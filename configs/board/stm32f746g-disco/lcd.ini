; STM32F746G-DISCO - 4.3" 480x272 TFT (Rocktech RK043FN48H) on the LTDC
;
; Pin mapping and timing match ST's BSP for this board
; (stm32746g_discovery_lcd.c / rk043fn48h.h):
;   R0=PI15  R1-R7=PJ0-PJ6
;   G0-G4=PJ7-PJ11  G5-G7=PK0-PK2
;   B0=PE4  B1-B3=PJ13-PJ15  B4=PG12 (AF9!)  B5-B7=PK4-PK6
;   HSYNC=PI10  VSYNC=PI9  CLK=PI14  DE=PK7
;   LCD_DISP=PI12 (display on), LCD_BL_CTRL=PK3 (backlight enable)
; Every RGB/sync pin uses AF14 (LTDC) except PG12, which is LTDC_B4 on AF9.
; PI9/PI10 are also FMC D30/D31 - that is why sdram.ini (dmfmc) only uses
; the 16-bit SDRAM data bus on this board.
;
; The framebuffers (480*272*2 = 255 KiB each in RGB565) do not fit the
; internal heap, they are allocated from the SDRAM heap registered by dmfmc
; (heap_usage=heap in sdram.ini) - keep driver_order after dmfmc's.
;
; Splash screen: clear_color is the dark navy of the dmodOS splash
; background, the logo in the middle comes from $SPLASH_LOGO (dmod-boot puts
; it in /eviews/splash_logo.dmvir).
;
; Double buffered: one buffer is shown while the other is drawn, and
; DMDRVI_IOCTL_GFX_PRESENT switches them in the vertical blank - nothing is
; ever drawn into the buffer on the screen.

[lcd_rgb_port_e]
driver_name=dmgpio
driver_order=5
friends_group=lcd
port=E
pins=0x0010
mode=alternate
alternate_function=14
speed=maximum
output_circuit=push_pull
pull=none

[lcd_rgb_port_g]
driver_name=dmgpio
driver_order=5
friends_group=lcd
port=G
pins=0x1000
mode=alternate
alternate_function=9
speed=maximum
output_circuit=push_pull
pull=none

[lcd_rgb_port_i]
driver_name=dmgpio
driver_order=5
friends_group=lcd
port=I
pins=0xC600
mode=alternate
alternate_function=14
speed=maximum
output_circuit=push_pull
pull=none

[lcd_rgb_port_j]
driver_name=dmgpio
driver_order=5
friends_group=lcd
port=J
pins=0xEFFF
mode=alternate
alternate_function=14
speed=maximum
output_circuit=push_pull
pull=none

[lcd_rgb_port_k]
driver_name=dmgpio
driver_order=5
friends_group=lcd
port=K
pins=0x00F7
mode=alternate
alternate_function=14
speed=maximum
output_circuit=push_pull
pull=none

[lcd]
driver_name=dmlcdtft
driver_order=6
friends_group=lcd
instance=0
width=480
height=272
pixel_format=rgb565
pixel_clock=9600000
hsync_width=41
hback_porch=13
hfront_porch=32
vsync_width=10
vback_porch=2
vfront_porch=2
hsync_polarity=low
vsync_polarity=low
de_polarity=low
pclk_inverted=off
background_color=0x000000
clear_color=0xFF041431
double_buffer=on

; Panel control pins - dmlcdtft drives them once the controller runs (and
; on DMDRVI_IOCTL_GFX_SET_DISPLAY_ENABLED / _set_backlight).
[lcd_disp]
driver_name=dmgpio
driver_order=6
friends_group=lcd
friend_role=display_enable
pin=PI12
mode=output
speed=minimum
output_circuit=push_pull
pull=none

[lcd_backlight]
driver_name=dmgpio
driver_order=6
friends_group=lcd
friend_role=backlight
pin=PK3
mode=output
speed=minimum
output_circuit=push_pull
pull=none
