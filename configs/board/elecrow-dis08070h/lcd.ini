; Elecrow DIS08070H (CrowPanel 7.0", V3.0) - 800x480 RGB panel on the LCD_CAM of the ESP32-S3
;
; The pins and the timing are those of the vendor's code (16 bit RGB565, the pixel clock 12 MHz, DE mode: the syncs are active low, the data
; enable is active high, the data changes on the falling edge of the clock, the clock is low when idle). The frame buffer (750 KiB, the
; external RAM) is read by the GDMA all the time - nothing may touch the flash cache for long (a write to the flash disturbs the picture).
; Backlight: IO2 (a steady level here; PWM comes with dmpwm).

[lcd]
driver_name=dmlcdtft
driver_order=3
friends_group=lcd
instance=0
width=800
height=480
pixel_format=rgb565
pixel_clock=12000000
hsync_width=48
hback_porch=40
hfront_porch=40
vsync_width=31
vback_porch=13
vfront_porch=1
hsync_polarity=low
vsync_polarity=low
de_polarity=high
pclk_inverted=on
background_color=0x000000
clear_color=0xFF041431
double_buffer=off
; 10 lines in a half of the bounce buffer in the internal RAM (2 x 16000 bytes): the LCD does not wait for the PSRAM
bounce_lines=10

; B0-B4, G0-G5, R0-R4 (the pixel bits 0-15)
pin_d0=15
pin_d1=7
pin_d2=6
pin_d3=5
pin_d4=4
pin_d5=9
pin_d6=46
pin_d7=3
pin_d8=8
pin_d9=16
pin_d10=1
pin_d11=14
pin_d12=21
pin_d13=47
pin_d14=48
pin_d15=45
pin_de=41
pin_vsync=40
pin_hsync=39
pin_pclk=0

[lcd_backlight]
driver_name=dmgpio
driver_order=3
friends_group=lcd
friend_role=backlight
pin=PA2
mode=output
output_circuit=push_pull
pull=none
